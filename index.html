<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Лимонад Онлайн</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
            overflow-x: hidden;
        }

        body {
            background: linear-gradient(145deg, #1a2a32 0%, #2c3e4e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            padding: 1rem;
        }

        .simulator {
            background: #e8f0f5;
            background-image: radial-gradient(circle at 20% 30%, #ffffff30 0%, #b0c4d9 100%);
            padding: 2rem 2.5rem 2.5rem;
            border-radius: 4rem 4rem 3rem 3rem;
            box-shadow: 0 30px 35px -10px rgba(0, 0, 0, 0.5), inset 0 2px 10px #ffffff80;
            border-bottom: 6px solid #8faec7;
            max-width: 900px;
            width: 100%;
        }

        .title {
            text-align: center;
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: #1e3b4f;
            text-shadow: 3px 3px 0 #c0d4e4, 0 4px 10px #00000030;
            margin-top: -0.5rem;
            margin-bottom: 1.5rem;
            text-transform: uppercase;
        }

        .top-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding: 0 0.5rem;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .trust-points {
            background: #f9e75c;
            padding: 0.6rem 1.5rem;
            border-radius: 40px;
            font-weight: 700;
            font-size: 1.3rem;
            color: #1e3b4f;
            box-shadow: 0 4px 0 #c9a82b, inset 0 2px 8px #fff9cf;
            border: 2px solid #ffffff;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        .top-buttons {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .shop-btn {
            background: #7b4fa0;
            border: none;
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            padding: 0.6rem 1.5rem;
            border-radius: 40px;
            box-shadow: 0 6px 0 #4e2a6b, 0 8px 15px -3px #2d1245;
            cursor: pointer;
            transition: all 0.1s ease;
            border: 2px solid #c9a8e8;
            text-shadow: 0 2px 0 #3d1f58;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .shop-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #4e2a6b, 0 6px 12px -3px #2d1245;
        }

        .achieve-btn {
            background: #4f9a6b;
            border: none;
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            padding: 0.6rem 1.5rem;
            border-radius: 40px;
            box-shadow: 0 6px 0 #2e6642, 0 8px 15px -3px #173520;
            cursor: pointer;
            transition: all 0.1s ease;
            border: 2px solid #a8e8c9;
            text-shadow: 0 2px 0 #1f4a2e;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .achieve-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #2e6642, 0 6px 12px -3px #173520;
        }

        .glass-container {
            display: flex;
            justify-content: center;
            margin-bottom: 1.8rem;
            position: relative;
        }

        canvas {
            display: block;
            width: 300px;
            height: 380px;
            max-width: 100%;
            border-radius: 0 0 80px 80px;
            background: #d9e3ec;
            box-shadow: inset 0 -10px 20px #00000020, 0 20px 25px -8px #0b1a24;
            cursor: pointer;
            transition: filter 0.2s;
            border: 2px solid #ffffff80;
            border-top: none;
            touch-action: manipulation;
        }

        canvas:active {
            filter: brightness(0.96);
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            align-items: center;
        }

        .flavor-panel {
            display: flex;
            gap: 0.8rem;
            justify-content: center;
            flex-wrap: wrap;
            max-width: 800px;
        }

        .flavor-btn {
            border: none;
            background: #f5faff;
            padding: 0.6rem 1.2rem;
            border-radius: 100px;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #1e3b4f;
            box-shadow: 0 7px 0 #6c8da8, 0 10px 18px -6px #0d1f2b;
            cursor: pointer;
            transition: all 0.1s ease;
            border: 2px solid #ffffff;
            text-shadow: 0 1px 2px white;
            display: flex;
            align-items: center;
            gap: 5px;
            min-width: 110px;
            justify-content: center;
            touch-action: manipulation;
        }

        .flavor-btn .emoji {
            font-size: 1.3rem;
            filter: drop-shadow(0 2px 2px rgba(0,0,0,0.1));
        }

        .flavor-btn:active {
            transform: translateY(5px);
            box-shadow: 0 2px 0 #6c8da8, 0 8px 18px -6px #0d1f2b;
        }

        .flavor-btn.active {
            outline: 4px solid #f9e75c;
            outline-offset: 2px;
            filter: brightness(1.05);
        }

        .flavor-btn.locked {
            opacity: 0.6;
            filter: grayscale(0.7);
            box-shadow: 0 7px 0 #999, 0 10px 18px -6px #0d1f2b;
            cursor: not-allowed;
            position: relative;
        }

        .flavor-btn.locked::after {
            content: '🔒';
            position: absolute;
            top: -8px;
            right: -8px;
            font-size: 1.1rem;
            filter: drop-shadow(0 2px 2px rgba(0,0,0,0.3));
        }

        .action-buttons {
            display: flex;
            gap: 1rem;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
        }

        .pour-btn {
            background: #3d6b8c;
            border: none;
            color: white;
            font-size: 1.5rem;
            font-weight: bold;
            padding: 0.9rem 2.8rem;
            border-radius: 100px;
            box-shadow: 0 10px 0 #1d3b4f, 0 15px 25px -5px #0a1620;
            cursor: pointer;
            transition: all 0.1s ease;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            border: 2px solid #aad0f0;
            text-shadow: 0 2px 0 #1d3b4f;
            touch-action: manipulation;
        }

        .pour-btn:active {
            transform: translateY(6px);
            box-shadow: 0 4px 0 #1d3b4f, 0 12px 22px -5px #0a1620;
        }

        .pour-btn:disabled {
            opacity: 0.45;
            transform: translateY(4px);
            box-shadow: 0 6px 0 #1d3b4f;
            pointer-events: none;
            filter: grayscale(0.3);
        }

        .gift-btn {
            background: #e85d75;
            border: none;
            color: white;
            font-size: 1.3rem;
            font-weight: bold;
            padding: 0.9rem 2rem;
            border-radius: 100px;
            box-shadow: 0 10px 0 #a83a4e, 0 15px 25px -5px #4a1a24;
            cursor: pointer;
            transition: all 0.1s ease;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            border: 2px solid #ffb8c6;
            text-shadow: 0 2px 0 #a83a4e;
            animation: pulse-gift 1.5s infinite;
            touch-action: manipulation;
        }

        @keyframes pulse-gift {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .gift-btn:active {
            transform: translateY(6px) scale(1);
            box-shadow: 0 4px 0 #a83a4e, 0 12px 22px -5px #4a1a24;
            animation: none;
        }

        .gift-btn.hidden {
            display: none;
        }

        .status {
            font-weight: 600;
            font-size: 1.1rem;
            color: #1b3f55;
            background: #e1eef9c0;
            padding: 0.3rem 1.8rem;
            border-radius: 40px;
            backdrop-filter: blur(2px);
            box-shadow: inset 0 2px 8px white, 0 5px 10px #00000010;
            margin-bottom: 0.2rem;
            border: 1px solid #ffffffb0;
            text-align: center;
        }

        .reset-btn {
            background: transparent;
            border: 2px solid #6c8da8;
            color: #1e3b4f;
            font-weight: 600;
            font-size: 1rem;
            padding: 0.4rem 1.5rem;
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.1s;
            box-shadow: 0 4px 0 #b0c4d9;
            background: #f0f7ff;
            touch-action: manipulation;
        }

        .reset-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #b0c4d9;
        }

        .footer-buttons {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        /* Модальное окно (общее) */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 20, 30, 0.85);
            backdrop-filter: blur(6px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            padding: 1rem;
        }

        .modal-overlay.open {
            opacity: 1;
            pointer-events: all;
        }

        .modal {
            background: #e8f0f5;
            background-image: radial-gradient(circle at 30% 20%, #ffffff50 0%, #b0c4d9 100%);
            border-radius: 3rem 3rem 2rem 2rem;
            padding: 2rem 2rem;
            width: 100%;
            max-width: 550px;
            max-height: 85vh;
            box-shadow: 0 30px 50px -10px #00000080, inset 0 2px 10px #ffffff80;
            border-bottom: 6px solid #8faec7;
            transform: scale(0.9);
            transition: transform 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .modal-overlay.open .modal {
            transform: scale(1);
        }

        .modal-title {
            text-align: center;
            font-size: 1.8rem;
            font-weight: 700;
            color: #1e3b4f;
            text-shadow: 2px 2px 0 #c0d4e4;
            margin-bottom: 1.2rem;
            flex-shrink: 0;
        }

        .shop-items, .achievements-list {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            margin-bottom: 1.2rem;
            overflow-y: auto;
            padding-right: 4px;
            flex: 1;
            -webkit-overflow-scrolling: touch;
        }

        .shop-items::-webkit-scrollbar,
        .achievements-list::-webkit-scrollbar {
            width: 8px;
        }

        .shop-items::-webkit-scrollbar-track,
        .achievements-list::-webkit-scrollbar-track {
            background: #ffffff40;
            border-radius: 10px;
        }

        .shop-items::-webkit-scrollbar-thumb,
        .achievements-list::-webkit-scrollbar-thumb {
            background: #6c8da8;
            border-radius: 10px;
        }

        .shop-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #ffffffb0;
            padding: 0.7rem 1.2rem;
            border-radius: 100px;
            box-shadow: 0 4px 0 #b0c4d9, inset 0 2px 6px white;
            border: 2px solid #ffffff;
            flex-shrink: 0;
            gap: 0.5rem;
        }

        .shop-item-info {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.1rem;
            font-weight: 700;
            color: #1e3b4f;
            min-width: 0;
        }

        .shop-item-info .emoji {
            font-size: 1.6rem;
            flex-shrink: 0;
        }

        .shop-item-info span:last-child {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .buy-btn {
            background: #3d6b8c;
            border: none;
            color: white;
            font-size: 0.95rem;
            font-weight: bold;
            padding: 0.5rem 1.2rem;
            border-radius: 100px;
            box-shadow: 0 4px 0 #1d3b4f;
            cursor: pointer;
            transition: all 0.1s ease;
            border: 2px solid #aad0f0;
            text-shadow: 0 1px 0 #1d3b4f;
            min-width: 100px;
            white-space: nowrap;
            flex-shrink: 0;
            touch-action: manipulation;
        }

        .buy-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #1d3b4f;
        }

        .buy-btn:disabled {
            opacity: 0.5;
            transform: translateY(2px);
            box-shadow: 0 2px 0 #1d3b4f;
            pointer-events: none;
            filter: grayscale(0.5);
        }

        .close-modal {
            display: block;
            margin: 0 auto;
            background: transparent;
            border: 2px solid #6c8da8;
            color: #1e3b4f;
            font-weight: 600;
            font-size: 1.1rem;
            padding: 0.6rem 2rem;
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.1s;
            box-shadow: 0 4px 0 #b0c4d9;
            background: #f0f7ff;
            flex-shrink: 0;
            touch-action: manipulation;
        }

        .close-modal:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #b0c4d9;
        }

        /* Достижения */
        .achievement {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #ffffffb0;
            padding: 0.8rem 1.2rem;
            border-radius: 20px;
            box-shadow: 0 4px 0 #b0c4d9, inset 0 2px 6px white;
            border: 2px solid #ffffff;
            flex-shrink: 0;
        }

        .achievement.locked {
            opacity: 0.55;
            filter: grayscale(0.6);
        }

        .achievement-icon {
            font-size: 2rem;
            flex-shrink: 0;
        }

        .achievement-info {
            flex: 1;
            min-width: 0;
        }

        .achievement-name {
            font-weight: 700;
            font-size: 1.05rem;
            color: #1e3b4f;
            margin-bottom: 2px;
        }

        .achievement-desc {
            font-size: 0.85rem;
            color: #3d5a70;
        }

        .achievement-progress {
            font-size: 0.8rem;
            color: #7b4fa0;
            font-weight: 700;
            margin-top: 2px;
        }

        .achievement-status {
            font-size: 1.5rem;
            flex-shrink: 0;
        }

        /* ========= АДАПТИВ ========= */

        @media (max-width: 768px) {
            body {
                padding: 0.5rem;
                align-items: flex-start;
            }

            .simulator {
                padding: 1.5rem 1.5rem 2rem;
                border-radius: 3rem 3rem 2.5rem 2.5rem;
            }

            .title {
                font-size: 1.6rem;
                margin-bottom: 1rem;
            }

            .trust-points {
                font-size: 1.1rem;
                padding: 0.5rem 1.2rem;
            }

            .shop-btn, .achieve-btn {
                font-size: 1rem;
                padding: 0.5rem 1.2rem;
            }

            canvas {
                width: 260px;
                height: 330px;
            }

            .flavor-btn {
                font-size: 0.9rem;
                min-width: 95px;
                padding: 0.5rem 1rem;
            }

            .flavor-btn .emoji {
                font-size: 1.1rem;
            }

            .pour-btn {
                font-size: 1.3rem;
                padding: 0.8rem 2.2rem;
            }

            .gift-btn {
                font-size: 1.1rem;
                padding: 0.8rem 1.6rem;
            }

            .modal {
                padding: 1.5rem 1.5rem;
                border-radius: 2.5rem 2.5rem 1.8rem 1.8rem;
            }

            .modal-title {
                font-size: 1.5rem;
            }
        }

        @media (max-width: 520px) {
            body {
                padding: 0;
                align-items: stretch;
            }

            .simulator {
                padding: 1rem 0.8rem 1.5rem;
                border-radius: 0;
                border-bottom-width: 4px;
                min-height: 100vh;
                display: flex;
                flex-direction: column;
            }

            .title {
                font-size: 1.3rem;
                letter-spacing: 1px;
                margin-bottom: 0.8rem;
                margin-top: 0;
            }

            .top-panel {
                padding: 0;
                margin-bottom: 0.8rem;
            }

            .trust-points {
                font-size: 1rem;
                padding: 0.45rem 1rem;
                gap: 6px;
                box-shadow: 0 3px 0 #c9a82b, inset 0 2px 6px #fff9cf;
            }

            .shop-btn, .achieve-btn {
                font-size: 0.9rem;
                padding: 0.45rem 1rem;
                gap: 4px;
            }

            .shop-btn {
                box-shadow: 0 4px 0 #4e2a6b, 0 6px 12px -3px #2d1245;
            }

            .achieve-btn {
                box-shadow: 0 4px 0 #2e6642, 0 6px 12px -3px #173520;
            }

            .glass-container {
                margin-bottom: 1rem;
                flex: 1;
                display: flex;
                align-items: center;
            }

            canvas {
                width: 200px;
                height: 260px;
                border-radius: 0 0 60px 60px;
            }

            .controls {
                gap: 0.9rem;
            }

            .flavor-panel {
                gap: 0.5rem;
            }

            .flavor-btn {
                font-size: 0.8rem;
                min-width: 82px;
                padding: 0.4rem 0.7rem;
                gap: 3px;
                border-radius: 60px;
                box-shadow: 0 5px 0 #6c8da8, 0 8px 14px -6px #0d1f2b;
            }

            .flavor-btn .emoji {
                font-size: 1rem;
            }

            .flavor-btn.locked::after {
                font-size: 0.9rem;
                top: -6px;
                right: -6px;
            }

            .flavor-btn.active {
                outline-width: 3px;
                outline-offset: 1px;
            }

            .action-buttons {
                gap: 0.6rem;
            }

            .pour-btn {
                font-size: 1.1rem;
                padding: 0.7rem 1.8rem;
                letter-spacing: 1px;
                box-shadow: 0 7px 0 #1d3b4f, 0 10px 20px -5px #0a1620;
            }

            .gift-btn {
                font-size: 1rem;
                padding: 0.7rem 1.3rem;
                letter-spacing: 0.5px;
                box-shadow: 0 7px 0 #a83a4e, 0 10px 20px -5px #4a1a24;
            }

            .status {
                font-size: 0.9rem;
                padding: 0.25rem 1.2rem;
                margin-bottom: 0;
            }

            .reset-btn {
                font-size: 0.9rem;
                padding: 0.35rem 1.2rem;
            }

            .footer-buttons {
                gap: 8px;
            }

            .modal-overlay {
                padding: 0.5rem;
            }

            .modal {
                padding: 1.2rem 1rem;
                border-radius: 2rem 2rem 1.5rem 1.5rem;
                max-height: 90vh;
            }

            .modal-title {
                font-size: 1.3rem;
                margin-bottom: 1rem;
            }

            .shop-item {
                padding: 0.6rem 0.9rem;
                border-radius: 60px;
            }

            .shop-item-info {
                font-size: 0.95rem;
                gap: 7px;
            }

            .shop-item-info .emoji {
                font-size: 1.3rem;
            }

            .buy-btn {
                font-size: 0.85rem;
                padding: 0.45rem 0.9rem;
                min-width: 88px;
            }

            .close-modal {
                font-size: 1rem;
                padding: 0.5rem 1.5rem;
            }

            .achievement {
                padding: 0.6rem 0.9rem;
                border-radius: 16px;
            }

            .achievement-icon {
                font-size: 1.5rem;
            }

            .achievement-name {
                font-size: 0.92rem;
            }

            .achievement-desc {
                font-size: 0.78rem;
            }

            .achievement-progress {
                font-size: 0.75rem;
            }

            .achievement-status {
                font-size: 1.2rem;
            }
        }

        @media (max-width: 360px) {
            .title {
                font-size: 1.1rem;
            }

            canvas {
                width: 170px;
                height: 220px;
            }

            .flavor-btn {
                font-size: 0.72rem;
                min-width: 72px;
                padding: 0.35rem 0.5rem;
            }

            .flavor-btn .emoji {
                font-size: 0.9rem;
            }

            .pour-btn {
                font-size: 1rem;
                padding: 0.6rem 1.4rem;
            }

            .gift-btn {
                font-size: 0.9rem;
                padding: 0.6rem 1rem;
            }

            .trust-points {
                font-size: 0.9rem;
                padding: 0.4rem 0.8rem;
            }

            .shop-btn, .achieve-btn {
                font-size: 0.85rem;
                padding: 0.4rem 0.8rem;
            }

            .shop-item-info {
                font-size: 0.85rem;
            }

            .buy-btn {
                font-size: 0.78rem;
                min-width: 78px;
                padding: 0.4rem 0.7rem;
            }
        }

        @media (max-height: 500px) and (orientation: landscape) {
            body {
                align-items: center;
            }

            .simulator {
                min-height: auto;
                padding: 0.8rem 1rem 1.2rem;
            }

            .title {
                font-size: 1.1rem;
                margin-bottom: 0.5rem;
            }

            .top-panel {
                margin-bottom: 0.5rem;
            }

            .glass-container {
                margin-bottom: 0.6rem;
                flex: none;
            }

            canvas {
                width: 140px;
                height: 180px;
                border-radius: 0 0 45px 45px;
            }

            .controls {
                gap: 0.6rem;
            }

            .flavor-panel {
                gap: 0.4rem;
            }

            .flavor-btn {
                font-size: 0.75rem;
                min-width: 76px;
                padding: 0.35rem 0.6rem;
            }

            .flavor-btn .emoji {
                font-size: 0.95rem;
            }

            .pour-btn {
                font-size: 1rem;
                padding: 0.55rem 1.5rem;
            }

            .gift-btn {
                font-size: 0.95rem;
                padding: 0.55rem 1.1rem;
            }

            .status {
                font-size: 0.85rem;
                padding: 0.2rem 1rem;
            }

            .reset-btn {
                font-size: 0.85rem;
                padding: 0.3rem 1rem;
            }
        }

        /* Уведомление о достижении */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: linear-gradient(135deg, #4f9a6b 0%, #2e6642 100%);
            color: white;
            padding: 1rem 2rem;
            border-radius: 60px;
            box-shadow: 0 10px 30px -5px #00000080, inset 0 2px 10px #ffffff40;
            font-weight: 700;
            font-size: 1.1rem;
            z-index: 2000;
            display: flex;
            align-items: center;
            gap: 10px;
            border: 2px solid #a8e8c9;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
            max-width: 90vw;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        @media (max-width: 520px) {
            .toast {
                font-size: 0.95rem;
                padding: 0.8rem 1.4rem;
                top: 10px;
            }
        }
    </style>
</head>
<body>
<div class="simulator">
    <div class="title">🍋 ЛИМОНАД ОНЛАЙН 🍹</div>

    <div class="top-panel">
        <div class="trust-points">
            <span>🤝</span> <span id="trustValue">0</span>
        </div>
        <div class="top-buttons">
            <button class="achieve-btn" id="achieveBtn">
                <span>🏆</span> Достижения
            </button>
            <button class="shop-btn" id="shopBtn">
                <span>🛒</span> Магазин
            </button>
        </div>
    </div>

    <div class="glass-container">
        <canvas id="glassCanvas" width="400" height="500"></canvas>
    </div>

    <div class="controls">
        <div class="flavor-panel" id="flavorPanel">
            <!-- Заполняется динамически -->
        </div>

        <div class="action-buttons">
            <button class="pour-btn" id="pourBtn">
                <span>🚰</span> НАЛИТЬ
            </button>
            <button class="gift-btn hidden" id="giftBtn">
                <span>🎁</span> Подарить другу
            </button>
        </div>

        <div class="footer-buttons">
            <div class="status" id="statusMsg">Выберите вкус</div>
            <button class="reset-btn" id="resetBtn">🔄 Сброс</button>
        </div>
    </div>
</div>

<!-- Магазин -->
<div class="modal-overlay" id="shopModal">
    <div class="modal">
        <div class="modal-title">🛒 Магазин вкусов</div>
        <div class="shop-items" id="shopItems"></div>
        <button class="close-modal" id="closeShopModal">Закрыть</button>
    </div>
</div>

<!-- Достижения -->
<div class="modal-overlay" id="achieveModal">
    <div class="modal">
        <div class="modal-title">🏆 Достижения</div>
        <div class="achievements-list" id="achievementsList"></div>
        <button class="close-modal" id="closeAchieveModal">Закрыть</button>
    </div>
</div>

<!-- Уведомление -->
<div class="toast" id="toast"></div>

<script>
    (function() {
        const canvas = document.getElementById('glassCanvas');
        const ctx = canvas.getContext('2d');
        const pourBtn = document.getElementById('pourBtn');
        const giftBtn = document.getElementById('giftBtn');
        const resetBtn = document.getElementById('resetBtn');
        const statusMsg = document.getElementById('statusMsg');
        const flavorPanel = document.getElementById('flavorPanel');
        const trustValueEl = document.getElementById('trustValue');
        const shopBtn = document.getElementById('shopBtn');
        const achieveBtn = document.getElementById('achieveBtn');
        const shopModal = document.getElementById('shopModal');
        const achieveModal = document.getElementById('achieveModal');
        const shopItems = document.getElementById('shopItems');
        const achievementsList = document.getElementById('achievementsList');
        const closeShopModal = document.getElementById('closeShopModal');
        const closeAchieveModal = document.getElementById('closeAchieveModal');
        const toast = document.getElementById('toast');

        // Размеры canvas
        const CANVAS_W = 400;
        const CANVAS_H = 500;

        // Параметры стакана
        const GLASS = {
            x: 100, y: 80, width: 200, bottomWidth: 160, height: 320,
        };
        const BOTTOM_X = GLASS.x + (GLASS.width - GLASS.bottomWidth) / 2;
        const BOTTOM_Y = GLASS.y + GLASS.height;
        const BOTTOM_W = GLASS.bottomWidth;

        // Состояние игры
        let fillLevel = 0.0;
        const MAX_FILL = 0.92;
        let trustPoints = 0;
        let totalGifts = 0;
        let totalPoured = 0; // сколько раз полностью налили
        let totalPurchases = 0;

        // Все вкусы
        const ALL_FLAVORS = [
            { id: 'classic', name: 'Классика', color: '#FFD966', emoji: '🍋', price: 0 },
            { id: 'tarhun', name: 'Тархун', color: '#8FD46A', emoji: '🌿', price: 3 },
            { id: 'dushes', name: 'Дюшес', color: '#F7B731', emoji: '🍐', price: 5 },
            { id: 'berry', name: 'Ягодный', color: '#E06B9E', emoji: '🍓', price: 8 },
            { id: 'pine', name: 'Шишковый', color: '#A68B5B', emoji: '🌲', price: 12 },
            { id: 'apple', name: 'Яблочный', color: '#C7E06B', emoji: '🍏', price: 10 },
            { id: 'cucumber', name: 'Огуречный', color: '#7FCB9E', emoji: '🥒', price: 15 },
            { id: 'ultra', name: 'Ультра крутой', color: '#D946EF', emoji: '💎', price: 1000 },
        ];

        // Достижения
        const ALL_ACHIEVEMENTS = [
            { id: 'first_gift', name: 'Первый подарок', desc: 'Подари первый стакан другу', icon: '🎁', check: () => totalGifts >= 1, progress: () => `${Math.min(totalGifts, 1)}/1` },
            { id: 'gift_10', name: 'Щедрая душа', desc: 'Подари 10 стаканов', icon: '💝', check: () => totalGifts >= 10, progress: () => `${Math.min(totalGifts, 10)}/10` },
            { id: 'gift_50', name: 'Друг всех', desc: 'Подари 50 стаканов', icon: '🤗', check: () => totalGifts >= 50, progress: () => `${Math.min(totalGifts, 50)}/50` },
            { id: 'gift_100', name: 'Легенда лимонада', desc: 'Подари 100 стаканов', icon: '👑', check: () => totalGifts >= 100, progress: () => `${Math.min(totalGifts, 100)}/100` },
            { id: 'first_buy', name: 'Шопоголик', desc: 'Купи первый вкус в магазине', icon: '🛍️', check: () => totalPurchases >= 1, progress: () => `${Math.min(totalPurchases, 1)}/1` },
            { id: 'buy_all', name: 'Коллекционер', desc: 'Купи все вкусы', icon: '🏆', check: () => unlockedFlavors.length >= ALL_FLAVORS.length, progress: () => `${unlockedFlavors.length}/${ALL_FLAVORS.length}` },
            { id: 'pour_25', name: 'Трудяга', desc: 'Налей 25 стаканов полностью', icon: '💧', check: () => totalPoured >= 25, progress: () => `${Math.min(totalPoured, 25)}/25` },
            { id: 'rich', name: 'Богач', desc: 'Накопи 50 очков доверия', icon: '💰', check: () => trustPoints >= 50, progress: () => `${Math.min(trustPoints, 50)}/50` },
            { id: 'ultra_owner', name: 'Ультра крутой', desc: 'Купи ультра крутой вкус', icon: '💎', check: () => unlockedFlavors.includes('ultra'), progress: () => unlockedFlavors.includes('ultra') ? '1/1' : '0/1' },
        ];

        // Разблокированные достижения (id)
        let unlockedAchievements = [];

        // Купленные вкусы
        let unlockedFlavors = ['classic'];

        let currentFlavor = {
            name: 'classic',
            color: '#FFD966',
            emoji: '🍋'
        };

        let isPouring = false;
        let pourInterval = null;

        // --- Звук (Web Audio API) ---
        let audioCtx = null;
        let soundEnabled = true;

        function initAudio() {
            if (!audioCtx) {
                try {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                } catch (e) {
                    console.log('Audio not supported');
                    soundEnabled = false;
                }
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // Звук наливания (непрерывный шум с фильтром)
        let pourSoundNode = null;
        let pourGainNode = null;

        function startPourSound() {
            if (!soundEnabled) return;
            initAudio();
            if (!audioCtx) return;

            try {
                // Шум для звука льющейся воды
                const bufferSize = audioCtx.sampleRate * 2;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }

                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;
                noise.loop = true;

                // Фильтр, чтобы звук был "водянистым"
                const filter = audioCtx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.value = 1200;
                filter.Q.value = 0.6;

                // Gain для контроля громкости
                pourGainNode = audioCtx.createGain();
                pourGainNode.gain.value = 0.08;

                // Небольшая модуляция частоты для "бульканья"
                const lfo = audioCtx.createOscillator();
                lfo.frequency.value = 3;
                const lfoGain = audioCtx.createGain();
                lfoGain.gain.value = 400;
                lfo.connect(lfoGain);
                lfoGain.connect(filter.frequency);
                lfo.start();

                noise.connect(filter);
                filter.connect(pourGainNode);
                pourGainNode.connect(audioCtx.destination);
                noise.start();

                pourSoundNode = { noise, lfo, filter };
            } catch (e) {
                console.log('Pour sound error', e);
            }
        }

        function stopPourSound() {
            if (pourSoundNode) {
                try {
                    pourSoundNode.noise.stop();
                    pourSoundNode.lfo.stop();
                    pourSoundNode.noise.disconnect();
                    pourSoundNode.lfo.disconnect();
                    if (pourGainNode) pourGainNode.disconnect();
                } catch (e) {}
                pourSoundNode = null;
                pourGainNode = null;
            }
        }

        // Звук "бульканья" (короткий пузырёк)
        function playBubbleSound() {
            if (!soundEnabled) return;
            initAudio();
            if (!audioCtx) return;

            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = 'sine';
                // Случайная высота
                const baseFreq = 400 + Math.random() * 600;
                osc.frequency.setValueAtTime(baseFreq, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(baseFreq * 2, audioCtx.currentTime + 0.08);

                gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);

                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            } catch (e) {}
        }

        // Звук успеха (для достижений и покупок)
        function playSuccessSound() {
            if (!soundEnabled) return;
            initAudio();
            if (!audioCtx) return;

            try {
                const notes = [523.25, 659.25, 783.99, 1046.50]; // C5 E5 G5 C6
                notes.forEach((freq, i) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.value = freq;
                    const startTime = audioCtx.currentTime + i * 0.08;
                    gain.gain.setValueAtTime(0.001, startTime);
                    gain.gain.exponentialRampToValueAtTime(0.15, startTime + 0.02);
                    gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.2);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(startTime);
                    osc.stop(startTime + 0.25);
                });
            } catch (e) {}
        }

        // Звук подарка
        function playGiftSound() {
            if (!soundEnabled) return;
            initAudio();
            if (!audioCtx) return;

            try {
                const notes = [659.25, 880, 1046.50];
                notes.forEach((freq, i) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.value = freq;
                    const startTime = audioCtx.currentTime + i * 0.1;
                    gain.gain.setValueAtTime(0.001, startTime);
                    gain.gain.exponentialRampToValueAtTime(0.18, startTime + 0.02);
                    gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.3);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(startTime);
                    osc.stop(startTime + 0.35);
                });
            } catch (e) {}
        }

        // --- Сохранение / загрузка ---
        const SAVE_KEY = 'lemonade_online_save_v1';

        function saveGame() {
            try {
                const data = {
                    trustPoints,
                    unlockedFlavors,
                    unlockedAchievements,
                    totalGifts,
                    totalPoured,
                    totalPurchases,
                    currentFlavorName: currentFlavor.name,
                    soundEnabled,
                };
                localStorage.setItem(SAVE_KEY, JSON.stringify(data));
            } catch (e) {
                console.log('Save error', e);
            }
        }

        function loadGame() {
            try {
                const raw = localStorage.getItem(SAVE_KEY);
                if (!raw) return;
                const data = JSON.parse(raw);

                if (typeof data.trustPoints === 'number') trustPoints = data.trustPoints;
                if (Array.isArray(data.unlockedFlavors)) {
                    // Проверяем, что вкусы существуют
                    unlockedFlavors = data.unlockedFlavors.filter(id => ALL_FLAVORS.some(f => f.id === id));
                    if (!unlockedFlavors.includes('classic')) unlockedFlavors.push('classic');
                }
                if (Array.isArray(data.unlockedAchievements)) {
                    unlockedAchievements = data.unlockedAchievements.filter(id => ALL_ACHIEVEMENTS.some(a => a.id === id));
                }
                if (typeof data.totalGifts === 'number') totalGifts = data.totalGifts;
                if (typeof data.totalPoured === 'number') totalPoured = data.totalPoured;
                if (typeof data.totalPurchases === 'number') totalPurchases = data.totalPurchases;
                if (typeof data.soundEnabled === 'boolean') soundEnabled = data.soundEnabled;

                // Восстанавливаем текущий вкус, если он куплен
                if (data.currentFlavorName && unlockedFlavors.includes(data.currentFlavorName)) {
                    const f = ALL_FLAVORS.find(fl => fl.id === data.currentFlavorName);
                    if (f) {
                        currentFlavor = { name: f.id, color: f.color, emoji: f.emoji };
                    }
                }
            } catch (e) {
                console.log('Load error', e);
            }
        }

        // --- Вспомогательные функции ---
        function getFillColor() {
            return currentFlavor.color;
        }

        function shadeColor(color, percent) {
            let R = parseInt(color.substring(1, 3), 16);
            let G = parseInt(color.substring(3, 5), 16);
            let B = parseInt(color.substring(5, 7), 16);
            R = Math.min(255, Math.max(0, R + percent));
            G = Math.min(255, Math.max(0, G + percent));
            B = Math.min(255, Math.max(0, B + percent));
            return `#${((1 << 24) + (R << 16) + (G << 8) + B).toString(16).slice(1)}`;
        }

        // --- Управление пузырьками ---
        const bubbles = [];

        function spawnBubble(liquidTopY, liquidHeight) {
            const bubbleX = BOTTOM_X + 15 + Math.random() * (BOTTOM_W - 30);
            const bubbleY = BOTTOM_Y - 10 - Math.random() * (liquidHeight * 0.5);
            const radius = 2 + Math.random() * 5;
            bubbles.push({
                x: bubbleX,
                y: bubbleY,
                r: radius,
                vy: 0.3 + Math.random() * 0.8,
                wobble: Math.random() * Math.PI * 2,
                wobbleSpeed: 0.05 + Math.random() * 0.1,
                alpha: 0.4 + Math.random() * 0.4,
                targetY: liquidTopY + 5,
            });
        }

        function updateBubbles() {
            for (let i = bubbles.length - 1; i >= 0; i--) {
                const b = bubbles[i];
                b.y -= b.vy;
                b.wobble += b.wobbleSpeed;
                b.x += Math.sin(b.wobble) * 0.4;
                // Если пузырёк достиг поверхности или вышел за пределы — удаляем
                if (b.y < b.targetY || b.y < GLASS.y) {
                    bubbles.splice(i, 1);
                }
            }
        }

        // --- Отрисовка ---
        function draw() {
            ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);

            // Фон
            const bgGrad = ctx.createLinearGradient(0, 0, 0, CANVAS_H);
            bgGrad.addColorStop(0, '#eef4fa');
            bgGrad.addColorStop(1, '#cad8e6');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

            // Тень
            ctx.shadowColor = '#00000040';
            ctx.shadowBlur = 30;
            ctx.shadowOffsetX = 10;
            ctx.shadowOffsetY = 15;
            ctx.fillStyle = '#eef4fa';
            ctx.beginPath();
            ctx.ellipse(200, 430, 130, 30, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowColor = 'transparent';

            // Контур стакана
            ctx.beginPath();
            ctx.moveTo(GLASS.x, GLASS.y);
            ctx.lineTo(GLASS.x + GLASS.width, GLASS.y);
            ctx.lineTo(BOTTOM_X + BOTTOM_W, BOTTOM_Y);
            ctx.lineTo(BOTTOM_X, BOTTOM_Y);
            ctx.closePath();
            ctx.fillStyle = '#ffffff20';
            ctx.fill();
            ctx.strokeStyle = '#c0d0e0';
            ctx.lineWidth = 6;
            ctx.stroke();

            let liquidTopY = BOTTOM_Y;

            // Жидкость
            if (fillLevel > 0.001) {
                const liquidHeight = GLASS.height * fillLevel;
                liquidTopY = BOTTOM_Y - liquidHeight;
                const t = (BOTTOM_Y - liquidTopY) / GLASS.height;
                const liquidWidth = GLASS.bottomWidth + (GLASS.width - GLASS.bottomWidth) * t;
                const liquidLeft = BOTTOM_X + (BOTTOM_W - liquidWidth) / 2;
                const liquidRight = liquidLeft + liquidWidth;

                ctx.beginPath();
                ctx.moveTo(liquidLeft, liquidTopY);
                ctx.lineTo(liquidRight, liquidTopY);
                ctx.lineTo(BOTTOM_X + BOTTOM_W, BOTTOM_Y);
                ctx.lineTo(BOTTOM_X, BOTTOM_Y);
                ctx.closePath();

                const liquidGrad = ctx.createLinearGradient(0, liquidTopY, 0, BOTTOM_Y);
                const baseColor = getFillColor();
                liquidGrad.addColorStop(0, baseColor);
                liquidGrad.addColorStop(0.7, baseColor);
                liquidGrad.addColorStop(1, shadeColor(baseColor, -20));
                ctx.fillStyle = liquidGrad;
                ctx.fill();

                // Блик на поверхности
                ctx.beginPath();
                ctx.moveTo(liquidLeft + 10, liquidTopY + 6);
                ctx.lineTo(liquidRight - 10, liquidTopY + 6);
                ctx.lineTo(liquidRight - 25, liquidTopY + 20);
                ctx.lineTo(liquidLeft + 25, liquidTopY + 20);
                ctx.closePath();
                ctx.fillStyle = '#ffffff60';
                ctx.fill();

                // Мениск
                ctx.beginPath();
                ctx.moveTo(liquidLeft, liquidTopY);
                ctx.lineTo(liquidRight, liquidTopY);
                ctx.strokeStyle = shadeColor(baseColor, -40);
                ctx.lineWidth = 3;
                ctx.stroke();

                // === РЕАЛИСТИЧНЫЕ ПУЗЫРЬКИ ===
                // Спавним новые пузырьки, если жидкость есть
                if (fillLevel > 0.08) {
                    const spawnChance = isPouring ? 0.6 : 0.25;
                    if (Math.random() < spawnChance) {
                        spawnBubble(liquidTopY, liquidHeight);
                    }
                }

                // Обновляем и рисуем пузырьки
                updateBubbles();
                bubbles.forEach(b => {
                    // Убедимся, что пузырёк внутри жидкости
                    if (b.y > liquidTopY && b.y < BOTTOM_Y) {
                        // Пузырёк — кружок с обводкой и бликом
                        ctx.beginPath();
                        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(255, 255, 255, ${b.alpha * 0.5})`;
                        ctx.fill();
                        ctx.strokeStyle = `rgba(255, 255, 255, ${b.alpha})`;
                        ctx.lineWidth = 1;
                        ctx.stroke();

                        // Блик на пузырьке
                        ctx.beginPath();
                        ctx.arc(b.x - b.r * 0.3, b.y - b.r * 0.3, b.r * 0.3, 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(255, 255, 255, ${b.alpha * 0.9})`;
                        ctx.fill();
                    }
                });
            }

            // Блик на стекле
            ctx.beginPath();
            ctx.moveTo(GLASS.x + 20, GLASS.y + 20);
            ctx.lineTo(GLASS.x + 40, GLASS.y + 20);
            ctx.lineTo(GLASS.x + 15, BOTTOM_Y - 40);
            ctx.lineTo(GLASS.x - 5, BOTTOM_Y - 40);
            ctx.closePath();
            ctx.fillStyle = '#ffffff40';
            ctx.fill();

            // Обводка стекла
            ctx.beginPath();
            ctx.moveTo(GLASS.x, GLASS.y);
            ctx.lineTo(GLASS.x + GLASS.width, GLASS.y);
            ctx.lineTo(BOTTOM_X + BOTTOM_W, BOTTOM_Y);
            ctx.lineTo(BOTTOM_X, BOTTOM_Y);
            ctx.closePath();
            ctx.strokeStyle = '#b0c8dd';
            ctx.lineWidth = 4;
            ctx.stroke();

            // Дно
            ctx.beginPath();
            ctx.ellipse(200, BOTTOM_Y + 6, BOTTOM_W / 2 + 10, 12, 0, 0, Math.PI * 2);
            ctx.fillStyle = '#c0d0e0';
            ctx.shadowColor = '#00000030';
            ctx.shadowBlur = 12;
            ctx.shadowOffsetY = 6;
            ctx.fill();
            ctx.shadowColor = 'transparent';

            // Процент
            ctx.font = 'bold 18px "Segoe UI", monospace';
            ctx.fillStyle = '#1e3b4f';
            ctx.shadowColor = '#ffffffc0';
            ctx.shadowBlur = 8;
            ctx.fillText(`${Math.round(fillLevel * 100)}%`, 310, 50);
            ctx.shadowColor = 'transparent';

            // Иконка вкуса
            ctx.font = '32px "Segoe UI", sans-serif';
            ctx.fillText(currentFlavor.emoji, 30, 55);
        }

        // --- Построение панели вкусов ---
        function renderFlavorPanel() {
            flavorPanel.innerHTML = '';
            ALL_FLAVORS.forEach(flavor => {
                const btn = document.createElement('button');
                btn.className = 'flavor-btn';
                btn.dataset.flavor = flavor.id;
                btn.dataset.color = flavor.color;
                btn.dataset.emoji = flavor.emoji;
                btn.dataset.price = flavor.price;

                if (!unlockedFlavors.includes(flavor.id)) {
                    btn.classList.add('locked');
                }
                if (currentFlavor.name === flavor.id) {
                    btn.classList.add('active');
                }

                btn.innerHTML = `<span class="emoji">${flavor.emoji}</span> ${flavor.name}`;

                btn.addEventListener('click', (e) => {
                    if (!unlockedFlavors.includes(flavor.id)) {
                        statusMsg.textContent = 'Этот вкус заблокирован! Купите в магазине.';
                        return;
                    }
                    document.querySelectorAll('.flavor-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');

                    currentFlavor = {
                        name: flavor.id,
                        color: flavor.color,
                        emoji: flavor.emoji
                    };
                    updateUI();
                    if (fillLevel > 0.01) {
                        statusMsg.textContent = `Вкус: ${flavor.name} ${flavor.emoji}`;
                    } else {
                        statusMsg.textContent = `Выбран ${flavor.name} ${flavor.emoji}`;
                    }
                    saveGame();
                });

                flavorPanel.appendChild(btn);
            });
        }

        // --- Проверка достижений ---
        function checkAchievements() {
            ALL_ACHIEVEMENTS.forEach(ach => {
                if (!unlockedAchievements.includes(ach.id) && ach.check()) {
                    unlockedAchievements.push(ach.id);
                    showToast(`🏆 Достижение: ${ach.name}!`, ach.icon);
                    playSuccessSound();
                }
            });
        }

        // --- Тост ---
        let toastTimeout = null;
        function showToast(text, icon = '🏆') {
            toast.innerHTML = `<span style="font-size:1.5rem">${icon}</span> <span>${text}</span>`;
            toast.classList.add('show');
            if (toastTimeout) clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // --- UI ---
        function updateUI() {
            draw();

            trustValueEl.textContent = trustPoints;

            if (fillLevel >= MAX_FILL) {
                statusMsg.textContent = 'Стакан полон! 🥳';
                giftBtn.classList.remove('hidden');
            } else if (fillLevel > 0.01) {
                statusMsg.textContent = `Налито ${Math.round(fillLevel * 100)}% ${currentFlavor.emoji}`;
                giftBtn.classList.add('hidden');
            } else {
                statusMsg.textContent = 'Выберите вкус и наливайте';
                giftBtn.classList.add('hidden');
            }

            pourBtn.disabled = (fillLevel >= MAX_FILL);

            document.querySelectorAll('.flavor-btn').forEach(btn => {
                const flavorId = btn.dataset.flavor;
                if (unlockedFlavors.includes(flavorId)) {
                    btn.classList.remove('locked');
                } else {
                    btn.classList.add('locked');
                }
                if (currentFlavor.name === flavorId) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });

            updateShopItems();
            checkAchievements();
            saveGame();
        }

        // --- Магазин ---
        function updateShopItems() {
            shopItems.innerHTML = '';
            const available = ALL_FLAVORS.filter(f => !unlockedFlavors.includes(f.id) && f.id !== 'classic');

            if (available.length === 0) {
                shopItems.innerHTML = '<div style="text-align:center; padding:1.5rem; font-size:1.1rem; color:#1e3b4f; font-weight:600;">Все вкусы уже куплены! 🎉</div>';
                return;
            }

            available.forEach(flavor => {
                const item = document.createElement('div');
                item.className = 'shop-item';
                item.innerHTML = `
                    <div class="shop-item-info">
                        <span class="emoji">${flavor.emoji}</span>
                        <span>${flavor.name}</span>
                    </div>
                    <button class="buy-btn" data-flavor="${flavor.id}" data-price="${flavor.price}" ${trustPoints < flavor.price ? 'disabled' : ''}>
                        ${flavor.price} 🤝
                    </button>
                `;
                shopItems.appendChild(item);
            });

            shopItems.querySelectorAll('.buy-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const flavorId = btn.dataset.flavor;
                    const price = parseInt(btn.dataset.price);
                    if (trustPoints >= price && !unlockedFlavors.includes(flavorId)) {
                        trustPoints -= price;
                        unlockedFlavors.push(flavorId);
                        totalPurchases++;
                        if (currentFlavor.name === flavorId) {
                            currentFlavor = { name: 'classic', color: '#FFD966', emoji: '🍋' };
                        }
                        updateUI();
                        playSuccessSound();
                        btn.textContent = '✅ Куплено!';
                        btn.disabled = true;
                        setTimeout(() => {
                            updateShopItems();
                            renderFlavorPanel();
                        }, 600);
                    }
                });
            });
        }

        // --- Достижения ---
        function renderAchievements() {
            achievementsList.innerHTML = '';
            ALL_ACHIEVEMENTS.forEach(ach => {
                const unlocked = unlockedAchievements.includes(ach.id);
                const item = document.createElement('div');
                item.className = 'achievement' + (unlocked ? '' : ' locked');
                item.innerHTML = `
                    <div class="achievement-icon">${ach.icon}</div>
                    <div class="achievement-info">
                        <div class="achievement-name">${ach.name}</div>
                        <div class="achievement-desc">${ach.desc}</div>
                        <div class="achievement-progress">${unlocked ? '✅ Получено' : 'Прогресс: ' + ach.progress()}</div>
                    </div>
                    <div class="achievement-status">${unlocked ? '🏅' : '🔒'}</div>
                `;
                achievementsList.appendChild(item);
            });
        }

        // --- Наливание ---
        let bubbleSoundInterval = null;

        function pourStep() {
            if (fillLevel >= MAX_FILL) {
                stopPouring();
                return;
            }
            const increment = 0.012 + Math.random() * 0.018;
            fillLevel = Math.min(fillLevel + increment, MAX_FILL);
            updateUI();
            if (fillLevel >= MAX_FILL) {
                totalPoured++;
                stopPouring();
                statusMsg.textContent = 'Стакан полон! 🥳';
                checkAchievements();
                saveGame();
            }
        }

        function startPouring() {
            if (isPouring || fillLevel >= MAX_FILL) return;
            initAudio(); // Разблокируем аудио по клику
            isPouring = true;
            pourBtn.innerHTML = '<span>💧</span> ЛЬЁТСЯ...';
            startPourSound();
            // Звуки бульканья во время наливания
            bubbleSoundInterval = setInterval(() => {
                if (Math.random() < 0.6) playBubbleSound();
            }, 250);
            pourInterval = setInterval(pourStep, 100);
        }

        function stopPouring() {
            if (pourInterval) {
                clearInterval(pourInterval);
                pourInterval = null;
            }
            if (bubbleSoundInterval) {
                clearInterval(bubbleSoundInterval);
                bubbleSoundInterval = null;
            }
            stopPourSound();
            isPouring = false;
            pourBtn.innerHTML = '<span>🚰</span> НАЛИТЬ';
            updateUI();
        }

        function resetSimulator() {
            stopPouring();
            fillLevel = 0.0;
            bubbles.length = 0;
            updateUI();
            statusMsg.textContent = 'Выберите вкус';
        }

        // --- Подарить другу ---
        function giveGift() {
            if (fillLevel < MAX_FILL) return;
            trustPoints += 3;
            totalGifts++;
            fillLevel = 0.0;
            bubbles.length = 0;
            playGiftSound();
            updateUI();
            statusMsg.textContent = 'Спасибо! +3 🤝';
            giftBtn.classList.add('hidden');
            checkAchievements();
            saveGame();
        }

        // --- События ---

        pourBtn.addEventListener('mousedown', (e) => {
            e.preventDefault();
            startPouring();
        });
        pourBtn.addEventListener('mouseup', (e) => {
            e.preventDefault();
            stopPouring();
        });
        pourBtn.addEventListener('mouseleave', () => {
            if (isPouring) stopPouring();
        });
        window.addEventListener('mouseup', () => {
            if (isPouring) stopPouring();
        });

        pourBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            startPouring();
        }, { passive: false });
        pourBtn.addEventListener('touchend', (e) => {
            e.preventDefault();
            stopPouring();
        }, { passive: false });
        pourBtn.addEventListener('touchcancel', (e) => {
            e.preventDefault();
            stopPouring();
        }, { passive: false });

        canvas.addEventListener('click', () => {
            if (fillLevel >= MAX_FILL) return;
            initAudio();
            fillLevel = Math.min(fillLevel + 0.15, MAX_FILL);
            playBubbleSound();
            updateUI();
            if (fillLevel >= MAX_FILL) {
                totalPoured++;
                statusMsg.textContent = 'Стакан полон! 🥳';
                checkAchievements();
                saveGame();
            }
        });

        giftBtn.addEventListener('click', giveGift);
        resetBtn.addEventListener('click', resetSimulator);

        // Магазин
        shopBtn.addEventListener('click', () => {
            initAudio();
            shopModal.classList.add('open');
            updateShopItems();
        });
        closeShopModal.addEventListener('click', () => {
            shopModal.classList.remove('open');
        });
        shopModal.addEventListener('click', (e) => {
            if (e.target === shopModal) {
                shopModal.classList.remove('open');
            }
        });

        // Достижения
        achieveBtn.addEventListener('click', () => {
            initAudio();
            achieveModal.classList.add('open');
            renderAchievements();
        });
        closeAchieveModal.addEventListener('click', () => {
            achieveModal.classList.remove('open');
        });
        achieveModal.addEventListener('click', (e) => {
            if (e.target === achieveModal) {
                achieveModal.classList.remove('open');
            }
        });

        // Анимация пузырьков (постоянная перерисовка, пока есть жидкость)
        function animateLoop() {
            if (fillLevel > 0.02) {
                draw();
            }
            requestAnimationFrame(animateLoop);
        }
        animateLoop();

        // Инициализация
        loadGame();
        renderFlavorPanel();
        updateUI();
    })();
</script>
</body>
    </html>

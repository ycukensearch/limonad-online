<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Лимонад Онлайн</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
            overflow-x: hidden;
        }

        body {
            background: linear-gradient(145deg, #1a2a32 0%, #2c3e4e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            padding: 1rem;
        }

        .simulator {
            background: #e8f0f5;
            background-image: radial-gradient(circle at 20% 30%, #ffffff30 0%, #b0c4d9 100%);
            padding: 2rem 2.5rem 2.5rem;
            border-radius: 4rem 4rem 3rem 3rem;
            box-shadow: 0 30px 35px -10px rgba(0, 0, 0, 0.5), inset 0 2px 10px #ffffff80;
            border-bottom: 6px solid #8faec7;
            max-width: 900px;
            width: 100%;
        }

        .title {
            text-align: center;
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: #1e3b4f;
            text-shadow: 3px 3px 0 #c0d4e4, 0 4px 10px #00000030;
            margin-top: -0.5rem;
            margin-bottom: 1.5rem;
            text-transform: uppercase;
        }

        .top-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding: 0 0.5rem;
            gap: 0.5rem;
        }

        .trust-points {
            background: #f9e75c;
            padding: 0.6rem 1.5rem;
            border-radius: 40px;
            font-weight: 700;
            font-size: 1.3rem;
            color: #1e3b4f;
            box-shadow: 0 4px 0 #c9a82b, inset 0 2px 8px #fff9cf;
            border: 2px solid #ffffff;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        .shop-btn {
            background: #7b4fa0;
            border: none;
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            padding: 0.6rem 1.5rem;
            border-radius: 40px;
            box-shadow: 0 6px 0 #4e2a6b, 0 8px 15px -3px #2d1245;
            cursor: pointer;
            transition: all 0.1s ease;
            border: 2px solid #c9a8e8;
            text-shadow: 0 2px 0 #3d1f58;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .shop-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #4e2a6b, 0 6px 12px -3px #2d1245;
        }

        .glass-container {
            display: flex;
            justify-content: center;
            margin-bottom: 1.8rem;
        }

        canvas {
            display: block;
            width: 300px;
            height: 380px;
            max-width: 100%;
            border-radius: 0 0 80px 80px;
            background: #d9e3ec;
            box-shadow: inset 0 -10px 20px #00000020, 0 20px 25px -8px #0b1a24;
            cursor: pointer;
            transition: filter 0.2s;
            border: 2px solid #ffffff80;
            border-top: none;
            touch-action: manipulation;
        }

        canvas:active {
            filter: brightness(0.96);
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            align-items: center;
        }

        .flavor-panel {
            display: flex;
            gap: 0.8rem;
            justify-content: center;
            flex-wrap: wrap;
            max-width: 800px;
        }

        .flavor-btn {
            border: none;
            background: #f5faff;
            padding: 0.6rem 1.2rem;
            border-radius: 100px;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #1e3b4f;
            box-shadow: 0 7px 0 #6c8da8, 0 10px 18px -6px #0d1f2b;
            cursor: pointer;
            transition: all 0.1s ease;
            border: 2px solid #ffffff;
            text-shadow: 0 1px 2px white;
            display: flex;
            align-items: center;
            gap: 5px;
            min-width: 110px;
            justify-content: center;
            touch-action: manipulation;
        }

        .flavor-btn .emoji {
            font-size: 1.3rem;
            filter: drop-shadow(0 2px 2px rgba(0,0,0,0.1));
        }

        .flavor-btn:active {
            transform: translateY(5px);
            box-shadow: 0 2px 0 #6c8da8, 0 8px 18px -6px #0d1f2b;
        }

        .flavor-btn.active {
            outline: 4px solid #f9e75c;
            outline-offset: 2px;
            filter: brightness(1.05);
        }

        .flavor-btn.locked {
            opacity: 0.6;
            filter: grayscale(0.7);
            box-shadow: 0 7px 0 #999, 0 10px 18px -6px #0d1f2b;
            cursor: not-allowed;
            position: relative;
        }

        .flavor-btn.locked::after {
            content: '🔒';
            position: absolute;
            top: -8px;
            right: -8px;
            font-size: 1.1rem;
            filter: drop-shadow(0 2px 2px rgba(0,0,0,0.3));
        }

        .action-buttons {
            display: flex;
            gap: 1rem;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
        }

        .pour-btn {
            background: #3d6b8c;
            border: none;
            color: white;
            font-size: 1.5rem;
            font-weight: bold;
            padding: 0.9rem 2.8rem;
            border-radius: 100px;
            box-shadow: 0 10px 0 #1d3b4f, 0 15px 25px -5px #0a1620;
            cursor: pointer;
            transition: all 0.1s ease;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            border: 2px solid #aad0f0;
            text-shadow: 0 2px 0 #1d3b4f;
            touch-action: manipulation;
        }

        .pour-btn:active {
            transform: translateY(6px);
            box-shadow: 0 4px 0 #1d3b4f, 0 12px 22px -5px #0a1620;
        }

        .pour-btn:disabled {
            opacity: 0.45;
            transform: translateY(4px);
            box-shadow: 0 6px 0 #1d3b4f;
            pointer-events: none;
            filter: grayscale(0.3);
        }

        .gift-btn {
            background: #e85d75;
            border: none;
            color: white;
            font-size: 1.3rem;
            font-weight: bold;
            padding: 0.9rem 2rem;
            border-radius: 100px;
            box-shadow: 0 10px 0 #a83a4e, 0 15px 25px -5px #4a1a24;
            cursor: pointer;
            transition: all 0.1s ease;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            border: 2px solid #ffb8c6;
            text-shadow: 0 2px 0 #a83a4e;
            animation: pulse-gift 1.5s infinite;
            touch-action: manipulation;
        }

        @keyframes pulse-gift {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .gift-btn:active {
            transform: translateY(6px) scale(1);
            box-shadow: 0 4px 0 #a83a4e, 0 12px 22px -5px #4a1a24;
            animation: none;
        }

        .gift-btn.hidden {
            display: none;
        }

        .status {
            font-weight: 600;
            font-size: 1.1rem;
            color: #1b3f55;
            background: #e1eef9c0;
            padding: 0.3rem 1.8rem;
            border-radius: 40px;
            backdrop-filter: blur(2px);
            box-shadow: inset 0 2px 8px white, 0 5px 10px #00000010;
            margin-bottom: 0.2rem;
            border: 1px solid #ffffffb0;
            text-align: center;
        }

        .reset-btn {
            background: transparent;
            border: 2px solid #6c8da8;
            color: #1e3b4f;
            font-weight: 600;
            font-size: 1rem;
            padding: 0.4rem 1.5rem;
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.1s;
            box-shadow: 0 4px 0 #b0c4d9;
            background: #f0f7ff;
            touch-action: manipulation;
        }

        .reset-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #b0c4d9;
        }

        .footer-buttons {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        /* Магазин (модальное окно) */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 20, 30, 0.85);
            backdrop-filter: blur(6px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            padding: 1rem;
        }

        .modal-overlay.open {
            opacity: 1;
            pointer-events: all;
        }

        .modal {
            background: #e8f0f5;
            background-image: radial-gradient(circle at 30% 20%, #ffffff50 0%, #b0c4d9 100%);
            border-radius: 3rem 3rem 2rem 2rem;
            padding: 2rem 2rem;
            width: 100%;
            max-width: 550px;
            max-height: 85vh;
            box-shadow: 0 30px 50px -10px #00000080, inset 0 2px 10px #ffffff80;
            border-bottom: 6px solid #8faec7;
            transform: scale(0.9);
            transition: transform 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .modal-overlay.open .modal {
            transform: scale(1);
        }

        .modal-title {
            text-align: center;
            font-size: 1.8rem;
            font-weight: 700;
            color: #1e3b4f;
            text-shadow: 2px 2px 0 #c0d4e4;
            margin-bottom: 1.2rem;
            flex-shrink: 0;
        }

        .shop-items {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            margin-bottom: 1.2rem;
            overflow-y: auto;
            padding-right: 4px;
            flex: 1;
            -webkit-overflow-scrolling: touch;
        }

        .shop-items::-webkit-scrollbar {
            width: 8px;
        }

        .shop-items::-webkit-scrollbar-track {
            background: #ffffff40;
            border-radius: 10px;
        }

        .shop-items::-webkit-scrollbar-thumb {
            background: #6c8da8;
            border-radius: 10px;
        }

        .shop-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #ffffffb0;
            padding: 0.7rem 1.2rem;
            border-radius: 100px;
            box-shadow: 0 4px 0 #b0c4d9, inset 0 2px 6px white;
            border: 2px solid #ffffff;
            flex-shrink: 0;
            gap: 0.5rem;
        }

        .shop-item-info {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.1rem;
            font-weight: 700;
            color: #1e3b4f;
            min-width: 0;
        }

        .shop-item-info .emoji {
            font-size: 1.6rem;
            flex-shrink: 0;
        }

        .shop-item-info span:last-child {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .buy-btn {
            background: #3d6b8c;
            border: none;
            color: white;
            font-size: 0.95rem;
            font-weight: bold;
            padding: 0.5rem 1.2rem;
            border-radius: 100px;
            box-shadow: 0 4px 0 #1d3b4f;
            cursor: pointer;
            transition: all 0.1s ease;
            border: 2px solid #aad0f0;
            text-shadow: 0 1px 0 #1d3b4f;
            min-width: 100px;
            white-space: nowrap;
            flex-shrink: 0;
            touch-action: manipulation;
        }

        .buy-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #1d3b4f;
        }

        .buy-btn:disabled {
            opacity: 0.5;
            transform: translateY(2px);
            box-shadow: 0 2px 0 #1d3b4f;
            pointer-events: none;
            filter: grayscale(0.5);
        }

        .close-modal {
            display: block;
            margin: 0 auto;
            background: transparent;
            border: 2px solid #6c8da8;
            color: #1e3b4f;
            font-weight: 600;
            font-size: 1.1rem;
            padding: 0.6rem 2rem;
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.1s;
            box-shadow: 0 4px 0 #b0c4d9;
            background: #f0f7ff;
            flex-shrink: 0;
            touch-action: manipulation;
        }

        .close-modal:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #b0c4d9;
        }

        /* ========= АДАПТИВ ========= */

        /* Планшеты и небольшие ноутбуки */
        @media (max-width: 768px) {
            body {
                padding: 0.5rem;
                align-items: flex-start;
            }

            .simulator {
                padding: 1.5rem 1.5rem 2rem;
                border-radius: 3rem 3rem 2.5rem 2.5rem;
            }

            .title {
                font-size: 1.6rem;
                margin-bottom: 1rem;
            }

            .trust-points {
                font-size: 1.1rem;
                padding: 0.5rem 1.2rem;
            }

            .shop-btn {
                font-size: 1rem;
                padding: 0.5rem 1.2rem;
            }

            canvas {
                width: 260px;
                height: 330px;
            }

            .flavor-btn {
                font-size: 0.9rem;
                min-width: 95px;
                padding: 0.5rem 1rem;
            }

            .flavor-btn .emoji {
                font-size: 1.1rem;
            }

            .pour-btn {
                font-size: 1.3rem;
                padding: 0.8rem 2.2rem;
            }

            .gift-btn {
                font-size: 1.1rem;
                padding: 0.8rem 1.6rem;
            }

            .modal {
                padding: 1.5rem 1.5rem;
                border-radius: 2.5rem 2.5rem 1.8rem 1.8rem;
            }

            .modal-title {
                font-size: 1.5rem;
            }
        }

        /* Телефоны */
        @media (max-width: 520px) {
            body {
                padding: 0;
                align-items: stretch;
            }

            .simulator {
                padding: 1rem 0.8rem 1.5rem;
                border-radius: 0;
                border-bottom-width: 4px;
                min-height: 100vh;
                display: flex;
                flex-direction: column;
            }

            .title {
                font-size: 1.3rem;
                letter-spacing: 1px;
                margin-bottom: 0.8rem;
                margin-top: 0;
            }

            .top-panel {
                padding: 0;
                margin-bottom: 0.8rem;
            }

            .trust-points {
                font-size: 1rem;
                padding: 0.45rem 1rem;
                gap: 6px;
                box-shadow: 0 3px 0 #c9a82b, inset 0 2px 6px #fff9cf;
            }

            .shop-btn {
                font-size: 0.9rem;
                padding: 0.45rem 1rem;
                gap: 4px;
                box-shadow: 0 4px 0 #4e2a6b, 0 6px 12px -3px #2d1245;
            }

            .glass-container {
                margin-bottom: 1rem;
                flex: 1;
                display: flex;
                align-items: center;
            }

            canvas {
                width: 200px;
                height: 260px;
                border-radius: 0 0 60px 60px;
            }

            .controls {
                gap: 0.9rem;
            }

            .flavor-panel {
                gap: 0.5rem;
            }

            .flavor-btn {
                font-size: 0.8rem;
                min-width: 82px;
                padding: 0.4rem 0.7rem;
                gap: 3px;
                border-radius: 60px;
                box-shadow: 0 5px 0 #6c8da8, 0 8px 14px -6px #0d1f2b;
            }

            .flavor-btn .emoji {
                font-size: 1rem;
            }

            .flavor-btn.locked::after {
                font-size: 0.9rem;
                top: -6px;
                right: -6px;
            }

            .flavor-btn.active {
                outline-width: 3px;
                outline-offset: 1px;
            }

            .action-buttons {
                gap: 0.6rem;
            }

            .pour-btn {
                font-size: 1.1rem;
                padding: 0.7rem 1.8rem;
                letter-spacing: 1px;
                box-shadow: 0 7px 0 #1d3b4f, 0 10px 20px -5px #0a1620;
            }

            .gift-btn {
                font-size: 1rem;
                padding: 0.7rem 1.3rem;
                letter-spacing: 0.5px;
                box-shadow: 0 7px 0 #a83a4e, 0 10px 20px -5px #4a1a24;
            }

            .status {
                font-size: 0.9rem;
                padding: 0.25rem 1.2rem;
                margin-bottom: 0;
            }

            .reset-btn {
                font-size: 0.9rem;
                padding: 0.35rem 1.2rem;
            }

            .footer-buttons {
                gap: 8px;
            }

            .modal-overlay {
                padding: 0.5rem;
            }

            .modal {
                padding: 1.2rem 1rem;
                border-radius: 2rem 2rem 1.5rem 1.5rem;
                max-height: 90vh;
            }

            .modal-title {
                font-size: 1.3rem;
                margin-bottom: 1rem;
            }

            .shop-item {
                padding: 0.6rem 0.9rem;
                border-radius: 60px;
            }

            .shop-item-info {
                font-size: 0.95rem;
                gap: 7px;
            }

            .shop-item-info .emoji {
                font-size: 1.3rem;
            }

            .buy-btn {
                font-size: 0.85rem;
                padding: 0.45rem 0.9rem;
                min-width: 88px;
            }

            .close-modal {
                font-size: 1rem;
                padding: 0.5rem 1.5rem;
            }
        }

        /* Очень маленькие телефоны */
        @media (max-width: 360px) {
            .title {
                font-size: 1.1rem;
            }

            canvas {
                width: 170px;
                height: 220px;
            }

            .flavor-btn {
                font-size: 0.72rem;
                min-width: 72px;
                padding: 0.35rem 0.5rem;
            }

            .flavor-btn .emoji {
                font-size: 0.9rem;
            }

            .pour-btn {
                font-size: 1rem;
                padding: 0.6rem 1.4rem;
            }

            .gift-btn {
                font-size: 0.9rem;
                padding: 0.6rem 1rem;
            }

            .trust-points {
                font-size: 0.9rem;
                padding: 0.4rem 0.8rem;
            }

            .shop-btn {
                font-size: 0.85rem;
                padding: 0.4rem 0.8rem;
            }

            .shop-item-info {
                font-size: 0.85rem;
            }

            .buy-btn {
                font-size: 0.78rem;
                min-width: 78px;
                padding: 0.4rem 0.7rem;
            }
        }

        /* Ландшафтная ориентация на телефоне */
        @media (max-height: 500px) and (orientation: landscape) {
            body {
                align-items: center;
            }

            .simulator {
                min-height: auto;
                padding: 0.8rem 1rem 1.2rem;
            }

            .title {
                font-size: 1.1rem;
                margin-bottom: 0.5rem;
            }

            .top-panel {
                margin-bottom: 0.5rem;
            }

            .glass-container {
                margin-bottom: 0.6rem;
                flex: none;
            }

            canvas {
                width: 140px;
                height: 180px;
                border-radius: 0 0 45px 45px;
            }

            .controls {
                gap: 0.6rem;
            }

            .flavor-panel {
                gap: 0.4rem;
            }

            .flavor-btn {
                font-size: 0.75rem;
                min-width: 76px;
                padding: 0.35rem 0.6rem;
            }

            .flavor-btn .emoji {
                font-size: 0.95rem;
            }

            .pour-btn {
                font-size: 1rem;
                padding: 0.55rem 1.5rem;
            }

            .gift-btn {
                font-size: 0.95rem;
                padding: 0.55rem 1.1rem;
            }

            .status {
                font-size: 0.85rem;
                padding: 0.2rem 1rem;
            }

            .reset-btn {
                font-size: 0.85rem;
                padding: 0.3rem 1rem;
            }
        }
    </style>
</head>
<body>
<div class="simulator">
    <div class="title">🍋 ЛИМОНАД ОНЛАЙН 🍹</div>

    <div class="top-panel">
        <div class="trust-points">
            <span>🤝</span> <span id="trustValue">0</span>
        </div>
        <button class="shop-btn" id="shopBtn">
            <span>🛒</span> Магазин
        </button>
    </div>

    <div class="glass-container">
        <canvas id="glassCanvas" width="400" height="500"></canvas>
    </div>

    <div class="controls">
        <div class="flavor-panel" id="flavorPanel">
            <!-- Заполняется динамически -->
        </div>

        <div class="action-buttons">
            <button class="pour-btn" id="pourBtn">
                <span>🚰</span> НАЛИТЬ
            </button>
            <button class="gift-btn hidden" id="giftBtn">
                <span>🎁</span> Подарить другу
            </button>
        </div>

        <div class="footer-buttons">
            <div class="status" id="statusMsg">Выберите вкус</div>
            <button class="reset-btn" id="resetBtn">🔄 Сброс</button>
        </div>
    </div>
</div>

<!-- Модальное окно магазина -->
<div class="modal-overlay" id="shopModal">
    <div class="modal">
        <div class="modal-title">🛒 Магазин вкусов</div>
        <div class="shop-items" id="shopItems">
            <!-- Заполняется динамически -->
        </div>
        <button class="close-modal" id="closeModal">Закрыть</button>
    </div>
</div>

<script>
    (function() {
        const canvas = document.getElementById('glassCanvas');
        const ctx = canvas.getContext('2d');
        const pourBtn = document.getElementById('pourBtn');
        const giftBtn = document.getElementById('giftBtn');
        const resetBtn = document.getElementById('resetBtn');
        const statusMsg = document.getElementById('statusMsg');
        const flavorPanel = document.getElementById('flavorPanel');
        const trustValueEl = document.getElementById('trustValue');
        const shopBtn = document.getElementById('shopBtn');
        const shopModal = document.getElementById('shopModal');
        const shopItems = document.getElementById('shopItems');
        const closeModal = document.getElementById('closeModal');

        // Размеры canvas
        const CANVAS_W = 400;
        const CANVAS_H = 500;

        // Параметры стакана
        const GLASS = {
            x: 100,
            y: 80,
            width: 200,
            bottomWidth: 160,
            height: 320,
        };
        const BOTTOM_X = GLASS.x + (GLASS.width - GLASS.bottomWidth) / 2;
        const BOTTOM_Y = GLASS.y + GLASS.height;
        const BOTTOM_W = GLASS.bottomWidth;

        // Состояние игры
        let fillLevel = 0.0;
        const MAX_FILL = 0.92;
        let trustPoints = 0;

        // Все вкусы (магазин + стартовые)
        const ALL_FLAVORS = [
            { id: 'classic', name: 'Классика', color: '#FFD966', emoji: '🍋', price: 0 },
            { id: 'tarhun', name: 'Тархун', color: '#8FD46A', emoji: '🌿', price: 3 },
            { id: 'dushes', name: 'Дюшес', color: '#F7B731', emoji: '🍐', price: 5 },
            { id: 'berry', name: 'Ягодный', color: '#E06B9E', emoji: '🍓', price: 8 },
            { id: 'pine', name: 'Шишковый', color: '#A68B5B', emoji: '🌲', price: 12 },
            { id: 'apple', name: 'Яблочный', color: '#C7E06B', emoji: '🍏', price: 10 },
            { id: 'cucumber', name: 'Огуречный', color: '#7FCB9E', emoji: '🥒', price: 15 },
            { id: 'ultra', name: 'Ультра крутой', color: '#D946EF', emoji: '💎', price: 1000 },
        ];

        // Купленные вкусы (classic всегда доступен)
        let unlockedFlavors = ['classic'];

        let currentFlavor = {
            name: 'classic',
            color: '#FFD966',
            emoji: '🍋'
        };

        let isPouring = false;
        let pourInterval = null;

        // --- Вспомогательные функции ---
        function getFillColor() {
            return currentFlavor.color;
        }

        function shadeColor(color, percent) {
            let R = parseInt(color.substring(1, 3), 16);
            let G = parseInt(color.substring(3, 5), 16);
            let B = parseInt(color.substring(5, 7), 16);
            R = Math.min(255, Math.max(0, R + percent));
            G = Math.min(255, Math.max(0, G + percent));
            B = Math.min(255, Math.max(0, B + percent));
            return `#${((1 << 24) + (R << 16) + (G << 8) + B).toString(16).slice(1)}`;
        }

        // --- Отрисовка ---
        function draw() {
            ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);

            // Фон
            const bgGrad = ctx.createLinearGradient(0, 0, 0, CANVAS_H);
            bgGrad.addColorStop(0, '#eef4fa');
            bgGrad.addColorStop(1, '#cad8e6');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

            // Тень
            ctx.shadowColor = '#00000040';
            ctx.shadowBlur = 30;
            ctx.shadowOffsetX = 10;
            ctx.shadowOffsetY = 15;
            ctx.fillStyle = '#eef4fa';
            ctx.beginPath();
            ctx.ellipse(200, 430, 130, 30, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowColor = 'transparent';

            // Контур стакана
            ctx.beginPath();
            ctx.moveTo(GLASS.x, GLASS.y);
            ctx.lineTo(GLASS.x + GLASS.width, GLASS.y);
            ctx.lineTo(BOTTOM_X + BOTTOM_W, BOTTOM_Y);
            ctx.lineTo(BOTTOM_X, BOTTOM_Y);
            ctx.closePath();
            ctx.fillStyle = '#ffffff20';
            ctx.fill();
            ctx.strokeStyle = '#c0d0e0';
            ctx.lineWidth = 6;
            ctx.stroke();

            // Жидкость
            if (fillLevel > 0.001) {
                const liquidHeight = GLASS.height * fillLevel;
                const liquidTopY = BOTTOM_Y - liquidHeight;
                const t = (BOTTOM_Y - liquidTopY) / GLASS.height;
                const liquidWidth = GLASS.bottomWidth + (GLASS.width - GLASS.bottomWidth) * t;
                const liquidLeft = BOTTOM_X + (BOTTOM_W - liquidWidth) / 2;
                const liquidRight = liquidLeft + liquidWidth;

                ctx.beginPath();
                ctx.moveTo(liquidLeft, liquidTopY);
                ctx.lineTo(liquidRight, liquidTopY);
                ctx.lineTo(BOTTOM_X + BOTTOM_W, BOTTOM_Y);
                ctx.lineTo(BOTTOM_X, BOTTOM_Y);
                ctx.closePath();

                const liquidGrad = ctx.createLinearGradient(0, liquidTopY, 0, BOTTOM_Y);
                const baseColor = getFillColor();
                liquidGrad.addColorStop(0, baseColor);
                liquidGrad.addColorStop(0.7, baseColor);
                liquidGrad.addColorStop(1, shadeColor(baseColor, -20));
                ctx.fillStyle = liquidGrad;
                ctx.fill();

                // Блик
                ctx.beginPath();
                ctx.moveTo(liquidLeft + 10, liquidTopY + 6);
                ctx.lineTo(liquidRight - 10, liquidTopY + 6);
                ctx.lineTo(liquidRight - 25, liquidTopY + 20);
                ctx.lineTo(liquidLeft + 25, liquidTopY + 20);
                ctx.closePath();
                ctx.fillStyle = '#ffffff60';
                ctx.fill();

                // Мениск
                ctx.beginPath();
                ctx.moveTo(liquidLeft, liquidTopY);
                ctx.lineTo(liquidRight, liquidTopY);
                ctx.strokeStyle = shadeColor(baseColor, -40);
                ctx.lineWidth = 3;
                ctx.stroke();

                // Пузырьки
                if (fillLevel > 0.1) {
                    ctx.fillStyle = '#ffffff70';
                    for (let i = 0; i < 6; i++) {
                        const bubbleX = BOTTOM_X + 20 + Math.random() * (BOTTOM_W - 40);
                        const bubbleY = BOTTOM_Y - 15 - Math.random() * (liquidHeight * 0.7);
                        const radius = 3 + Math.random() * 5;
                        ctx.beginPath();
                        ctx.arc(bubbleX, bubbleY, radius, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
            }

            // Блик на стекле
            ctx.beginPath();
            ctx.moveTo(GLASS.x + 20, GLASS.y + 20);
            ctx.lineTo(GLASS.x + 40, GLASS.y + 20);
            ctx.lineTo(GLASS.x + 15, BOTTOM_Y - 40);
            ctx.lineTo(GLASS.x - 5, BOTTOM_Y - 40);
            ctx.closePath();
            ctx.fillStyle = '#ffffff40';
            ctx.fill();

            // Обводка стекла
            ctx.beginPath();
            ctx.moveTo(GLASS.x, GLASS.y);
            ctx.lineTo(GLASS.x + GLASS.width, GLASS.y);
            ctx.lineTo(BOTTOM_X + BOTTOM_W, BOTTOM_Y);
            ctx.lineTo(BOTTOM_X, BOTTOM_Y);
            ctx.closePath();
            ctx.strokeStyle = '#b0c8dd';
            ctx.lineWidth = 4;
            ctx.stroke();

            // Дно
            ctx.beginPath();
            ctx.ellipse(200, BOTTOM_Y + 6, BOTTOM_W / 2 + 10, 12, 0, 0, Math.PI * 2);
            ctx.fillStyle = '#c0d0e0';
            ctx.shadowColor = '#00000030';
            ctx.shadowBlur = 12;
            ctx.shadowOffsetY = 6;
            ctx.fill();
            ctx.shadowColor = 'transparent';

            // Процент
            ctx.font = 'bold 18px "Segoe UI", monospace';
            ctx.fillStyle = '#1e3b4f';
            ctx.shadowColor = '#ffffffc0';
            ctx.shadowBlur = 8;
            ctx.fillText(`${Math.round(fillLevel * 100)}%`, 310, 50);
            ctx.shadowColor = 'transparent';

            // Иконка вкуса
            ctx.font = '32px "Segoe UI", sans-serif';
            ctx.fillText(currentFlavor.emoji, 30, 55);
        }

        // --- Построение панели вкусов ---
        function renderFlavorPanel() {
            flavorPanel.innerHTML = '';
            ALL_FLAVORS.forEach(flavor => {
                const btn = document.createElement('button');
                btn.className = 'flavor-btn';
                btn.dataset.flavor = flavor.id;
                btn.dataset.color = flavor.color;
                btn.dataset.emoji = flavor.emoji;
                btn.dataset.price = flavor.price;

                if (!unlockedFlavors.includes(flavor.id)) {
                    btn.classList.add('locked');
                }
                if (currentFlavor.name === flavor.id) {
                    btn.classList.add('active');
                }

                btn.innerHTML = `<span class="emoji">${flavor.emoji}</span> ${flavor.name}`;

                btn.addEventListener('click', (e) => {
                    if (!unlockedFlavors.includes(flavor.id)) {
                        statusMsg.textContent = 'Этот вкус заблокирован! Купите в магазине.';
                        return;
                    }
                    document.querySelectorAll('.flavor-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');

                    currentFlavor = {
                        name: flavor.id,
                        color: flavor.color,
                        emoji: flavor.emoji
                    };
                    updateUI();
                    if (fillLevel > 0.01) {
                        statusMsg.textContent = `Вкус: ${flavor.name} ${flavor.emoji}`;
                    } else {
                        statusMsg.textContent = `Выбран ${flavor.name} ${flavor.emoji}`;
                    }
                });

                flavorPanel.appendChild(btn);
            });
        }

        // --- UI ---
        function updateUI() {
            draw();

            trustValueEl.textContent = trustPoints;

            if (fillLevel >= MAX_FILL) {
                statusMsg.textContent = 'Стакан полон! 🥳';
                giftBtn.classList.remove('hidden');
            } else if (fillLevel > 0.01) {
                statusMsg.textContent = `Налито ${Math.round(fillLevel * 100)}% ${currentFlavor.emoji}`;
                giftBtn.classList.add('hidden');
            } else {
                statusMsg.textContent = 'Выберите вкус и наливайте';
                giftBtn.classList.add('hidden');
            }

            pourBtn.disabled = (fillLevel >= MAX_FILL);

            // Обновляем состояния кнопок вкусов (lock / active)
            document.querySelectorAll('.flavor-btn').forEach(btn => {
                const flavorId = btn.dataset.flavor;
                if (unlockedFlavors.includes(flavorId)) {
                    btn.classList.remove('locked');
                } else {
                    btn.classList.add('locked');
                }
                if (currentFlavor.name === flavorId) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });

            updateShopItems();
        }

        // --- Магазин ---
        function updateShopItems() {
            shopItems.innerHTML = '';
            // Показываем только некупленные вкусы (кроме classic с ценой 0 — он всегда есть)
            const available = ALL_FLAVORS.filter(f => !unlockedFlavors.includes(f.id) && f.id !== 'classic');

            if (available.length === 0) {
                shopItems.innerHTML = '<div style="text-align:center; padding:1.5rem; font-size:1.1rem; color:#1e3b4f; font-weight:600;">Все вкусы уже куплены! 🎉</div>';
                return;
            }

            available.forEach(flavor => {
                const item = document.createElement('div');
                item.className = 'shop-item';
                item.innerHTML = `
                    <div class="shop-item-info">
                        <span class="emoji">${flavor.emoji}</span>
                        <span>${flavor.name}</span>
                    </div>
                    <button class="buy-btn" data-flavor="${flavor.id}" data-price="${flavor.price}" ${trustPoints < flavor.price ? 'disabled' : ''}>
                        ${flavor.price} 🤝
                    </button>
                `;
                shopItems.appendChild(item);
            });

            shopItems.querySelectorAll('.buy-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const flavorId = btn.dataset.flavor;
                    const price = parseInt(btn.dataset.price);
                    if (trustPoints >= price && !unlockedFlavors.includes(flavorId)) {
                        trustPoints -= price;
                        unlockedFlavors.push(flavorId);
                        // Если это был текущий вкус — переключаемся на classic
                        if (currentFlavor.name === flavorId) {
                            currentFlavor = { name: 'classic', color: '#FFD966', emoji: '🍋' };
                        }
                        updateUI();
                        btn.textContent = '✅ Куплено!';
                        btn.disabled = true;
                        setTimeout(() => {
                            updateShopItems();
                            renderFlavorPanel();
                        }, 600);
                    }
                });
            });
        }

        // --- Наливание ---
        function pourStep() {
            if (fillLevel >= MAX_FILL) {
                stopPouring();
                return;
            }
            const increment = 0.012 + Math.random() * 0.018;
            fillLevel = Math.min(fillLevel + increment, MAX_FILL);
            updateUI();
            if (fillLevel >= MAX_FILL) {
                stopPouring();
                statusMsg.textContent = 'Стакан полон! 🥳';
            }
        }

        function startPouring() {
            if (isPouring || fillLevel >= MAX_FILL) return;
            isPouring = true;
            pourBtn.innerHTML = '<span>💧</span> ЛЬЁТСЯ...';
            pourInterval = setInterval(pourStep, 100);
        }

        function stopPouring() {
            if (pourInterval) {
                clearInterval(pourInterval);
                pourInterval = null;
            }
            isPouring = false;
            pourBtn.innerHTML = '<span>🚰</span> НАЛИТЬ';
            updateUI();
        }

        function resetSimulator() {
            stopPouring();
            fillLevel = 0.0;
            updateUI();
            statusMsg.textContent = 'Выберите вкус';
        }

        // --- Подарить другу ---
        function giveGift() {
            if (fillLevel < MAX_FILL) return;
            trustPoints += 3;
            fillLevel = 0.0;
            updateUI();
            statusMsg.textContent = 'Спасибо! +3 🤝';
            giftBtn.classList.add('hidden');
        }

        // --- События ---

        // Кнопка "Налить"
        pourBtn.addEventListener('mousedown', (e) => {
            e.preventDefault();
            startPouring();
        });
        pourBtn.addEventListener('mouseup', (e) => {
            e.preventDefault();
            stopPouring();
        });
        pourBtn.addEventListener('mouseleave', () => {
            if (isPouring) stopPouring();
        });
        window.addEventListener('mouseup', () => {
            if (isPouring) stopPouring();
        });

        // Touch
        pourBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            startPouring();
        }, { passive: false });
        pourBtn.addEventListener('touchend', (e) => {
            e.preventDefault();
            stopPouring();
        }, { passive: false });
        pourBtn.addEventListener('touchcancel', (e) => {
            e.preventDefault();
            stopPouring();
        }, { passive: false });

        // Клик по canvas
        canvas.addEventListener('click', () => {
            if (fillLevel >= MAX_FILL) return;
            fillLevel = Math.min(fillLevel + 0.15, MAX_FILL);
            updateUI();
            if (fillLevel >= MAX_FILL) {
                statusMsg.textContent = 'Стакан полон! 🥳';
            }
        });

        // Подарить другу
        giftBtn.addEventListener('click', giveGift);

        // Сброс
        resetBtn.addEventListener('click', resetSimulator);

        // Магазин
        shopBtn.addEventListener('click', () => {
            shopModal.classList.add('open');
            updateShopItems();
        });
        closeModal.addEventListener('click', () => {
            shopModal.classList.remove('open');
        });
        shopModal.addEventListener('click', (e) => {
            if (e.target === shopModal) {
                shopModal.classList.remove('open');
            }
        });

        // Анимация пузырьков
        setInterval(() => {
            if (fillLevel > 0.02 && !isPouring) {
                draw();
            }
        }, 200);

        // Инициализация
        renderFlavorPanel();
        updateUI();
    })();
</script>
</body>
  </html>
